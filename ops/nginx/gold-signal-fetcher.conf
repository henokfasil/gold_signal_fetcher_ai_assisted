# Public TLS/authentication boundary for the research dashboard.
# Flask remains reachable only from this host on 127.0.0.1:8502.

limit_req_zone $binary_remote_addr zone=gold_dashboard:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 187.55.229.4;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 187.55.229.4;

    ssl_certificate /etc/letsencrypt/live/187.55.229.4/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/187.55.229.4/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GoldTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    auth_basic "Gold Signal Research";
    auth_basic_user_file /etc/nginx/gold-signal-fetcher.htpasswd;

    location / {
        limit_req zone=gold_dashboard burst=20 nodelay;
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
